name: Release

# On every v* tag: build the static OpenBSD binaries (amd64 + arm64) and attach
# them to the matching GitHub release (created if it does not exist yet),
# publish the container image (linux/amd64 + linux/arm64) and the Helm chart to
# GHCR.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & publish OpenBSD binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build SPA
        run: make web

      - name: Cross-compile OpenBSD binaries
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          for arch in amd64 arm64; do
            GOOS=openbsd GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "weft.openbsd-${arch}" ./cmd/weft
          done

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "weft $TAG" \
              --notes "Automated build for $TAG. See CHANGELOG.md."
          gh release upload "$TAG" \
            weft.openbsd-amd64 weft.openbsd-arm64 --clobber

  image:
    name: Publish container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

  chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Package and push to GHCR
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm package charts/weft --version "$version" --app-version "$version"
          helm push "weft-${version}.tgz" "oci://ghcr.io/${OWNER}/charts"
